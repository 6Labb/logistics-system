spring:
  application:
    name: company-service
  profiles:
    active: dev
  config:
    import: "configserver:http://localhost:18080"  # Config Server 주소 명시
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server  # Eureka를 통해 찾을 수도 있음

  datasource:
    url: jdbc:postgresql://localhost:5432/company_service?currentSchema=company_schema
    username: root  # 기존 컨테이너의 사용자 이름
    password: 1234  # 기존 컨테이너의 비밀번호
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

message: "default message" # config server를 통과하지 않을 때

management:
  endpoints:
    web:
      exposure:
        include: refresh

