spring:
  application:
    name: company-service
  profiles:
    active: dev
  config:
    import: "configserver:http://localhost:18080"  # Config Server 주소 명시

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

message: "default message" # config server를 통과하지 않을 때

management:
  endpoints:
    web:
      exposure:
        include: refresh

server:
  port: 19094


feign:
  circuitbreaker:
    enabled: true  # Fallback 기능을 활성화

springdoc:
  swagger-ui:
    enabled: true
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /api-docs-company-service