server:
  port: 19091

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery: # 서비스 디스커버리를 통해 동적으로 라우트를 생성항도록 설정
        locator:
          enabled: true
      routes:
        #        - id: user-service-users # 라우트 식별자
        #          uri: lb://user-service # 'user-service'라는 이름으로 로드 밸런싱된 서비스로 라우팅
        #          predicates:
        #            - Path=/users/** # /users/** 경로로 들어오는 요청을 이 라우트로 처리

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/signIn

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/hubs/**

        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/companies/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

        - id: slack-ai-service
          uri: lb://slack-ai-service
          predicates:
            - Path=/api/slack/**
            - Path=/api/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

service:
  jwt:
