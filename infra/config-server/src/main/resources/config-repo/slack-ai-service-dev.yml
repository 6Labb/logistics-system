server:
  port: 19098

message:
  queue:
    order: orderInfo-queue

spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_schema: ai_core
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: postgres
    password: lab6
    driver-class-name: org.postgresql.Driver
  application:
    name: slack-ai-service
  rabbitmq.host: localhost
  rabbitmq.port: 5672
  rabbitmq.username: guest
  rabbitmq.password: guest
  rabbitmq:
    listener:
      simple:
        acknowledge-mode : manual
  resilience4j:
    retry:
      instances:
        externalApi: # 외부 API 호출용 Retry 인스턴스
          maxRetryAttempts: 3
          waitDuration: 500ms
          enableExponentialBackoff: true
          exponentialBackoffMultiplier: 2
          retryExceptions: #재시도 예외처리
            - java.net.ConnectException
            - java.io.IOException
          ignoreExceptions:
            - java.lang.NullPointerException
        databaseCall: # DB 호출용 Retry 인스턴스
          maxRetryAttempts: 2
          waitDuration: 200ms
          retryExceptions:
            - org.springframework.dao.DataAccessException
    circuitbreaker:
      configs:
        default: # 기본 구성 이름
          slidingWindowType: COUNT_BASED  # 호출 수 기반(COUNT_BASED) / 시간 순 기반(TIME_BASED)
          slidingWindowSize: 5  # 슬라이딩 윈도우의 크기
          failureRateThreshold: 25  # 실패율 임계값 (%)
          minimumNumberOfCalls: 5  # 실패율 계산을 시작하기 위한 최소 호출 수
          slowCallRateThreshold: 100  # 느린 호출 비율 임계값 (%)
          slowCallDurationThreshold: 60000  # 느린 호출로 간주되는 시간
          permittedNumberOfCallsInHalfOpenState: 5  # Half-Open 상태에서 허용되는 호출 수
          waitDurationInOpenState: 20s  # Open 상태에서 대기하는 시간
          automaticTransitionFromOpenToHalfOpenEnabled: true # Open에서 Half-Open으로 자동 전환 여부
          registerHealthIndicator: true  #서킷 브레이커 상태 모니터링
slack:
  token: ${slack.token}
  uri: ${slack.uri}
gemini:
  key: ${gemini.key}
  uri: ${gemini.uri}

logging:
  level:
    root: INFO
    feign: DEBUG
    feign.client: DEBUG

management:
  zipkin:
    tracking:
    endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

service:
  jwt:
    access-expiration: 3600000
