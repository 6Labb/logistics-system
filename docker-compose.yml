services:
  postgres:
    image: postgres:15
    container_name: logistics-db
    restart: always
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab6
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - logistics-network

networks:
  logistics-network:

volumes:
  postgres-data: