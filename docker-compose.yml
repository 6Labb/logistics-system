services:
  postgres:
    image: postgres:15
    container_name: logistics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics #logistics
      POSTGRES_USER: postgres #postgres
      POSTGRES_PASSWORD: lab6 #lab6
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - logistics-network

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - logistics-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - logistics-network
    environment:
      - JAVA_OPTS=-XX:UseSVE=0

networks:
  logistics-network:

volumes:
  postgres-data:
    name: postgres_data
  redis_data:
    name: redis_data
